<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · HWR Novice</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 2rem 1rem;
				box-sizing: border-box;
				background: #f7f5f3;
				color: #1a1a1a;
				font-family: Inter, system-ui, sans-serif;
			}
			.panel {
				width: 100%;
				max-width: 30rem;
				padding: 2.5rem 2rem;
				box-sizing: border-box;
				background: #fff;
				border: 1px solid #d8d3cf;
				text-align: center;
			}
			.code {
				margin: 0 0 1rem;
				font-family: Inter, system-ui, sans-serif;
				font-size: 4.5rem;
				font-weight: 600;
				line-height: 1.1;
				color: #d82425;
			}
			h1 {
				margin: 0 0 0.75rem;
				font-family: 'Cormorant Garamond', Georgia, serif;
				font-size: 2rem;
			}
			p {
				margin: 0;
				color: #5a5a5a;
			}
			a {
				display: inline-block;
				margin-top: 1.75rem;
				padding: 0.6rem 1.2rem;
				background: #d82425;
				color: #fff;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<p class="code">%sveltekit.status%</p>
			<h1>Etwas ist schiefgelaufen</h1>
			<p>Bitte versuche es gleich noch einmal.</p>
			<a href="/">Zur Startseite</a>
		</div>
	</body>
</html>
